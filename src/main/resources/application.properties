# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/cafepos_db
spring.datasource.username=root
spring.datasource.password=Aye@1992

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.web.resources.static-locations=file:uploads/
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
# Keycloak issuer (realm URL)


# Spring Security OAuth2
spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:8081/realms/cafepos
spring.security.oauth2.client.registration.keycloak.client-id=cafe-pos-app
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/keycloakspring.security.oauth2.client.registration.keycloak.client-name=CafePOS
spring.security.oauth2.client.registration.keycloak.client-authentication-method=none
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/cafepos
# Server Port

server.port=8080

