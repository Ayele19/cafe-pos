# Tax API Credentials (loaded from environment variables)
taxapi.clientId=${TAXAPI_CLIENT_ID}
taxapi.clientSecret=${TAXAPI_CLIENT_SECRET}
taxapi.apiKey=${TAXAPI_API_KEY}
taxapi.taxpayerTin=${TAXAPI_TAXPAYER_TIN}
tax.api.authUrl=http://core.mor.gov.et/auth/login
tax.api.url=http://core.mor.gov.et/v1/register
tax.api.refreshTokenUrl=http://core.mor.gov.et/auth/refresh-token
tax.api.verification=http://core.mor.gov.et/v1/verify
